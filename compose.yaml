services:
  vera:
    build:
      context: .
    ports:
      - "127.0.0.1:43147:43147"
    volumes:
      - vera-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  vera-data:
